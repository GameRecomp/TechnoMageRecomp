<!-- The browser player without the converter's storage: the game over HTTP (serve.py), settings
     from the address (RC_FRAMES, RC_INPUT, RC_TRACE; shots=frame,… posts those frames as PPM;
     hashes=1 posts a hash of each frame at the end, a line a frame; cfg=a;b the settings file's
     lines; runtime=path of the runtime module in the checkout; output=WxH the size the picture
     is shown in). -->
<meta charset="utf-8"><canvas id="c" width="640" height="480"></canvas>
<script type="module">
import { run } from '/player.js';
const post = (path, body) => fetch(path, { method: 'POST', body });
const log = (t) => { console.log(t); post('/log', String(t)); };
window.onerror = (m, s, l, c, e) => log(`error: ${m} ${e && e.stack}`);
window.onunhandledrejection = (e) => log(`rejection: ${e.reason && (e.reason.stack || e.reason)}`);
const params = new URLSearchParams(location.search);
const env = Object.fromEntries([...params].filter(([k]) => k.startsWith('RC_')));
const shots = (params.get('shots') || '').split(',').filter(Boolean).map(Number);
log(`start: JSPI ${'Suspending' in WebAssembly}, ${navigator.userAgent}`);
const index = await (await fetch('/index.json')).json();
const tree = new Map();
const kids = new Map();
for (const [p, size] of index) {
  const path = '/' + p;
  tree.set(path.toLowerCase(), { path, size, dir: size < 0 });
  const parent = path.slice(0, path.lastIndexOf('/'));
  if (!kids.has(parent.toLowerCase())) kids.set(parent.toLowerCase(), []);
  if (path !== '/game') kids.get(parent.toLowerCase()).push(path.slice(path.lastIndexOf('/') + 1));
}
tree.set('/user', { path: '/user', dir: true, size: 0 });
const user = new Map();
// cfg=… (lines separated by ";"): the project's settings file to start with.
if (params.get('cfg')) user.set('/user/technomagerecomp.cfg', new TextEncoder().encode(params.get('cfg').split(';').join('\n') + '\n'));
const fds = new Map(); let next = 1;
const fs = {
  stat(p) {
    if (p.startsWith('/user/')) { const f = user.get(p.toLowerCase()); return f ? { size: f.length, dir: false } : null; }
    const e = tree.get(p.toLowerCase()); return e ? { size: Math.max(0, e.size), dir: e.dir } : null;
  },
  list(p) {
    if (p === '/user') return [...user.keys()].map((k) => k.slice(6));
    return tree.has(p.toLowerCase()) ? (kids.get(p.toLowerCase()) || []) : null;
  },
  open(p, flags) {
    if (p.startsWith('/user/')) {
      const k = p.toLowerCase();
      if (!user.has(k)) { if (!(flags & 2)) return -1; user.set(k, new Uint8Array(0)); }
      if (flags & 8) user.set(k, new Uint8Array(0));
      fds.set(next, { user: k }); return next++;
    }
    const e = tree.get(p.toLowerCase());
    if (!e || e.dir) return -1;
    if (flags & 1) return -3;
    fds.set(next, { url: '/webgame/' + e.path.slice(1), size: e.size, block: -1, data: null }); return next++;
  },
  read(fd, at, len) {
    const h = fds.get(fd);
    if (h.user) { const d = user.get(h.user); return d.slice(at, at + len); }
    const end = Math.min(h.size, at + len);
    if (end <= at) return new Uint8Array(0);
    const B = 1 << 18; const b = Math.floor(at / B);
    if (h.block === b && end <= b * B + h.data.length) return h.data.slice(at - b * B, end - b * B);
    const from = end - at > B ? at : b * B;
    const to = end - at > B ? end : Math.min(h.size, from + 2 * B);
    return fetch(h.url, { headers: { Range: `bytes=${from}-${to - 1}` } }).then((r) => r.arrayBuffer()).then((x) => {
      const d = new Uint8Array(x);
      if (end - at <= B) { h.block = b; h.data = d; }
      return d.slice(at - from, end - from);
    });
  },
  write(fd, at, bytes) {
    const h = fds.get(fd); if (!h.user) return -1;
    let d = user.get(h.user);
    if (at + bytes.length > d.length) { const g = new Uint8Array(at + bytes.length); g.set(d); d = g; }
    d.set(bytes, at); user.set(h.user, d); return bytes.length;
  },
  size: (fd) => { const h = fds.get(fd); return h.user ? user.get(h.user).length : h.size; },
  truncate(fd, size) { const h = fds.get(fd); if (h.user) user.set(h.user, user.get(h.user).slice(0, size)); },
  flush() {}, close(fd) { fds.delete(fd); }, mkdir() { return true; }, remove(p) { return user.delete(p.toLowerCase()); },
};
let frames = 0; let onGpu = 0; const t0 = performance.now(); let tl = t0;
const hashes = params.get('hashes') ? [] : null;
// A frame: its pixels (`read()`, RGBA8) only as far as asked for.
function shown(read, w, h) {
  frames += 1;
  if (hashes) {
    // FNV-1a over the 32-bit words.
    const px = read();
    const words = new Uint32Array(px.buffer, px.byteOffset, px.length >> 2);
    let x = 0x811c9dc5;
    for (let i = 0; i < words.length; i += 1) x = Math.imul(x ^ words[i], 0x01000193);
    hashes.push(`${frames} ${w}x${h} ${(x >>> 0).toString(16).padStart(8, '0')}`);
  }
  if (shots.includes(frames)) {
    const rgba = read();
    const head = new TextEncoder().encode(`P6\n${w} ${h}\n255\n`);
    const out = new Uint8Array(head.length + w * h * 3);
    out.set(head);
    for (let i = 0; i < w * h; i += 1) { out[head.length + 3 * i] = rgba[4 * i]; out[head.length + 3 * i + 1] = rgba[4 * i + 1]; out[head.length + 3 * i + 2] = rgba[4 * i + 2]; }
    post(`/shot${frames}.ppm`, out.subarray(0, head.length + w * h * 3));
  }
  if (frames % 100 === 0) { const t = performance.now(); log(`frame ${frames}: ${(100000 / (t - tl)).toFixed(1)} frames/s`); tl = t; }
}
const postHashes = () => hashes && post('/hashes', hashes.join('\n') + '\n');
const player = await run({
  runtime: await (await fetch(`/repo/${params.get('runtime') || 'target/wasm32-unknown-unknown/release/technomage_web.wasm'}`)).arrayBuffer(),
  code: await (await fetch('/webgame/code.wasm')).arrayBuffer(),
  fs, env, log,
  present(rgba, w, h) { shown(() => rgba, w, h); },
  presentCanvas(_canvas, w, h, read) { onGpu += 1; shown(read, w, h); },
  frame: () => new Promise((r) => setTimeout(r, 0)),
  exit: async (c) => { await postHashes(); log(`exit ${c} after ${frames} frames (${onGpu} drawn on the GPU), ${((performance.now() - t0) / 1000).toFixed(0)} s`); },
});
// output=WxH: the size the page shows the picture in (native resolution follows it).
if (params.get('output')) player.output(...params.get('output').split('x').map(Number));
log('running');
const code = await player.start();
log(`returned ${code}`);
</script>
