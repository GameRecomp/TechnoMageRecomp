[package]
name = "rc-abi"
description = "What lifted code is compiled against: the guest CPU state, guest memory, x87, MMX and the runtime's entry points, kept small and stable so the lifted shards rarely rebuild"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
