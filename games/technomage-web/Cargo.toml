# SPDX-License-Identifier: MIT
[package]
name = "technomage-web"
description = "The TechnoMage player for the browser: the runtime and the HLE layer as a WebAssembly module that runs the game's code from the converter"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Only the browser build has anything to link; natively the crate is empty.
[target.'cfg(target_family = "wasm")'.dependencies]
rc-runtime.workspace = true
rc-hle = { workspace = true, features = ["gpu"] }
rc-platform.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
