[[variant]]
id = "cd-de"
store = "cd"
language = "de"
content = ["base"]
notes = """German full version on the SCREENFUN 03/2004 cover CD, as archived on archive.org (item \
SF2004-03): a raw MODE2/2352 image with an InstallShield 7 setup (data1.hdr, data1.cab, data2.cab). \
The videos (Mov/), the music (Mus/) and the speech (Spc/) stay on the CD and are read from there by the \
game. Version 1.04 (the build of the official patch 1.04, without its SecuROM wrapper): no patch is \
applied. The .cue beside the image is not needed."""
media = [
  { file = "2004-03.BIN", kind = "iso", size = 845217072, sha256 = "c9db7f91ae3d7755b88f9921c0904ee9f335463c4dde700c779454bd918e8ed7", url = "https://archive.org/download/SF2004-03/2004-03.BIN" },
]

