# The game project's changes (games/technomage/src/patches.rs): "Configure graphics" and "Show
# information" in the pause menu, the mouse pointer as a hardware cursor, widescreen.
[binary.patch]
# Functions behind the linker's jump thunks are entered (and hooked) at the thunk.
hooks = [
  0x401393, # a menu opened: the pause menu with our entry
  0x4011b8, # the options panel each frame
  0x401dc0, # a 3D object drawn: the mouse pointer as a hardware cursor
  0x402252, # the text of a key: ours first
  0x4025f9, # the options panel set up
  0x450a60, # the pause menu's value texts (by entry index)
  0x450b80, # a pause menu entry chosen (by entry index)
  0x460a30, # an options panel entry drawn
  0x530e60, # the frame's ordering table drawn: the pointer's primitives on their own;
            #   widescreen: on the whole width
  0x4010b9, # widescreen: the camera (the projection's centre) on the wider screen
  0x40148d, # widescreen: the world's primitives put into the ordering table, culled to the
  0x401ff0, #   wider screen
  0x4025ef,
  0x401721,
  0x4021da, # widescreen: which objects are on the wider screen
  0x401357,
  0x40201d,
  0x4025a4, # widescreen: the level's tile radius (more tiles drawn beside)
  0x53c8d0, # widescreen: a video played (only its picture shown)
  0x401140, # the input page each frame: its tabs (keyboard and mouse, gamepad, touch)
  0x538790, # the joystick's button table set: the PlayStation version's set-up in front
]

