[[variant]]
id = "cd-en"
store = "cd"
language = "en"
content = ["base"]
cd_dirs = ["Mov", "Mus", "Spc"]
notes = """European English CD (mastered 2001-05-03), as archived on archive.org (item \
TechnoMage_Return_of_Eternity_Europe) inside Disc.rar. archive.org serves the archive's members on their own \
("view contents"), so the Alcohol image TECHNOMAGE.mdf (raw MODE1/2352) is downloaded directly and no RAR \
reader is needed; the .mds beside it is not needed either. InstallShield 5 setup (DATA1.HDR, DATA1.CAB); \
Mov/, Mus/ and Spc/ (English speech) on the CD. Its executable is wrapped in SecuROM (docs/RESEARCH.md)."""
media = [
