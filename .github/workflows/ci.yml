# SPDX-License-Identifier: MIT
name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # No lifted code in CI (generated/ is never committed): the shell builds without it.
  RC_NO_GENERATED: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/audit.sh

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System libraries for the Bevy window (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      # The converter for the page and the browser player's runtime module.
      - run: cargo clippy --target wasm32-unknown-unknown -p rc-web -p technomage-web -- -D warnings
      - run: cargo build --release --target wasm32-unknown-unknown -p rc-web -p technomage-web
