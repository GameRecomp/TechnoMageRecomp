# SPDX-License-Identifier: MIT
# The converter page on GitHub Pages (tools/build-web): the converter as WebAssembly and the
# shell templates it fills, one per system (Windows and Linux on x86-64 and ARM64, Android), built
# here without lifted code, each on a runner of its own machine.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RC_NO_GENERATED: "1"

jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux on the oldest Ubuntu runner: the binaries need the glibc they were built
          # against or newer (docs/DEVELOPMENT.md, "Releases").
          - os: ubuntu-22.04
            system: linux
            exe: ""
          - os: windows-latest
            system: windows
            exe: ".exe"
          - os: ubuntu-22.04-arm
            system: linux-arm64
            exe: ""
          - os: windows-11-arm
            system: windows-arm64
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries for the Bevy window (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo build --profile dist -p technomage -p rc-cli
      - name: Template
        shell: bash
        run: |
          mkdir -p build/templates
          target/dist/recomp${{ matrix.exe }} template --game technomage --system ${{ matrix.system }} \
            --shell target/dist/technomage${{ matrix.exe }} -o build/templates/TechnoMage-${{ matrix.system }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: template-${{ matrix.system }}
          path: build/templates
  android:
    # The Android shell (tools/build-android): the runner has the Android SDK (ANDROID_HOME) and
    # NDK (ANDROID_NDK_LATEST_HOME).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - run: tools/build-android build/TechnoMage-shell.apk
      - run: cargo build --profile dist -p rc-cli
      - name: Template
        run: |
          mkdir -p build/templates
          target/dist/recomp template --game technomage --system android \
            --shell build/TechnoMage-shell.apk -o build/templates/TechnoMage-android.zip
      - uses: actions/upload-artifact@v4
        with:
          name: template-android
          path: build/templates
  site:
    needs: [shell, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: template-*
          merge-multiple: true
          path: build/templates
      - run: tools/build-web out/web build/templates
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/web
  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
