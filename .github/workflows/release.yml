# SPDX-License-Identifier: MIT
# On a version tag: the converter for Linux and Windows (recomp plus the game's shell template for
# that system) as release assets. The shell is built without lifted code; the converter adds the
# user's game, compiled to native code with Cranelift, on the user's machine.
name: release
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RC_NO_GENERATED: "1"

jobs:
  android:
    # The Android shell's template, for every converter (`recomp convert --system android`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - run: tools/build-android build/TechnoMage-shell.apk
      - run: cargo build --profile dist -p rc-cli
      - run: |
          mkdir -p build/templates
          target/dist/recomp template --game technomage --system android \
            --shell build/TechnoMage-shell.apk -o build/templates/TechnoMage-android.zip
      - uses: actions/upload-artifact@v4
        with:
          name: template-android
          path: build/templates
  converter:
    needs: android
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: linux
            exe: ""
          - os: windows-latest
            system: windows
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries for the Bevy window (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo build --profile dist -p technomage -p rc-cli
      - uses: actions/download-artifact@v4
        with:
          name: template-android
          path: dist/templates
      - name: Shell template
        shell: bash
        run: |
          mkdir -p dist/templates
          target/dist/recomp${{ matrix.exe }} template --game technomage --system ${{ matrix.system }} \
            --shell target/dist/technomage${{ matrix.exe }} -o dist/templates/TechnoMage-${{ matrix.system }}.zip
          cp target/dist/recomp${{ matrix.exe }} dist/
          cp README.md LICENSE dist/
      - name: Package
        shell: bash
        run: |
          cd dist
          7z a ../TechnoMageRecomp-converter-${{ matrix.system }}-x86_64.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: TechnoMageRecomp-converter-${{ matrix.system }}-x86_64.zip
