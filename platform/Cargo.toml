# SPDX-License-Identifier: MIT
[package]
name = "rc-platform"
description = "The host below the HLE layer: window and input (winit), rendering (wgpu), audio (cpal), and a null backend for tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# The GPU renderer (wgpu, offscreen): Direct3D's pixel pipeline.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# The game's backend: a Bevy window with the frames, input and audio.
# (wgpu and pollster: it picks the window's graphics backend before Bevy starts.)
bevy = ["dep:bevy", "dep:blake3", "dep:wgpu", "dep:pollster"]

[dependencies]
bytemuck = { version = "1", optional = true, features = ["derive"] }
bevy = { version = "0.20.1", optional = true, default-features = false, features = [
  "std",
  "async_executor",
  "multi_threaded",
  "bevy_asset",
  "bevy_log",
  "bevy_winit",
  "bevy_window",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_camera",
  "bevy_color",
  "bevy_image",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_audio",
  "custom_cursor",
  "keyboard",
  "mouse",
  "touch",
  "x11",
  "wayland",
] }

# Bevy's asset hashing: the portable Rust implementation, not the C and assembly one that
# blake3 builds with cc otherwise (Rust only, docs/PLAN.md).
blake3 = { version = "1", optional = true, default-features = false, features = ["pure", "std"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

# The GPU renderer's wgpu backend (in a browser the player's WebGL2 renders instead).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
wgpu = { version = "30.0.2", optional = true }
pollster = { version = "0.4", optional = true }

# Android (tools/build-android): Bevy in a NativeActivity (no Java), the app's assets through the
# NDK.
[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.20.1", optional = true, default-features = false, features = [
  "android-native-activity",
] }
